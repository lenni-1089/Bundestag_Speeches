models:

- name: stg_bundestag__speeches
  columns:
     
   - name: issn_id
     description: >
       An International Standard Serial Number (ISSN) is an eight-digit code 
       to uniquely identify a periodical publication. In our case an official
       transcript of a plenary debate of the German Bundestag.
     data_type: string
     data_tests:
      - not_null
     
   - name: legaslative_period
     description: "Legislative period to which a speech belongs."
     data_type: integer
     data_tests:
      - not_null
    
   - name: session_nr
     description: "Number of the plenary debate session of a given legislative period in which a speech was given."
     data_type: integer
     data_tests:
      - not_null

   - name: session_date
     description: "Date of the plenary debate session in which a speech was given."
     data_type: date
     data_tests:
      - not_null

   - name: session_start_time
     description: "Start time of the plenary debate."
     data_type: string

   - name: session_end_time
     description: "End time of the plenary debate."
     data_type: string
    
   - name: next_session_date
     description: "Date of the next plenary debate session."
     data_type: string
    
   - name: agenda_name
     description: "Agenda item type and evtl. number within a plenary debate."
     data_type: string
   
   - name: agenda_title
     description: "Title of an agenda item/specific debate within a plenary debate."
     data_type: string

   - name: agenda_subtitle
     description: "Subtitle of an agenda item within a plenary debate."
     data_type: string
 
   - name: agenda_docs
     description: "Documents an agenda item/specific debate relates to."
     data_type: list

   - name: speaker_id
     description: "Unique identifier for each speaker, given by the bundestag itself."
     data_type: string
     data_tests:
        - not_null

   - name: name
     description: "First name of a speaker."
     data_type: string
     data_tests:
        - not_null
    
   - name: lastname
     description: "Last name of a speaker."
     data_type: string
     data_tests:
        - not_null
        
   - name: role
     description: >
        "Role of a speaker, currently when regular member None, else role like Minister, Chancellor etc."
     data_type: string

   
   - name: party_affiliation
     description: "Political party affiliation of a speaker, if available."
     data_type: string
    
    # Primary key
   - name: speech_id
     description: "Unique identifier for each speech, given by the bundestag itself."
     data_type: string
     data_tests:
      - not_null
      - unique
   
   - name: speech
     description: "Content of the speech."
     data_type: string
     data_tests:
      - not_null
   
   - name: comments
     description: "Comments on the speech, if available."
     data_type: list[dict]
   
   - name: processed_at
     description: "Timestamp the speech was extracted, cleaned and validated."
     data_type: timestamp

   - name: updated_at
     description: "Timestamp of the last update of the speech record in databricks."
     data_type: timestamp
  
   - name: source_path
     description: "Path to the source xml-file in databricks from which the speech record was extracted."
     data_type: string
        
       
     